[project]
name = "wps-dataset"
version = "0.1.0"
description = "Windowed, memory-safe raster dataset processing - a gradual replacement for wps_shared.geospatial.wps_dataset.WPSDataset"
authors = [
    { name = "BC Wildfire Service", email = "BCWS.Predictive.Services@gov.bc.ca" },
]
requires-python = ">=3.12.3,<4.0"
dependencies = ["wps-shared", "numpy>=1,<3"]

[tool.uv.sources]
wps-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wps_dataset"]
