[project]
name = "wps-weather-data"
version = "0.1.0"
description = "Wildfire Predictive Services Unit station weather data in object storage"
authors = []
requires-python = ">=3.14,<3.15"
dependencies = [
    "wps-shared",
    "deltalake>=1.6.6,<2",
    "pyarrow>=26,<27",
]

[tool.uv.sources]
wps-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wps_weather_data"]
