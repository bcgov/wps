apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: ${APP_NAME}-${MODULE_NAME}
labels:
  app.kubernetes.io/part-of: "${APP_NAME}-${MODULE_NAME}"
  app: ${APP_NAME}-${SUFFIX}
parameters:
  - name: APP_NAME
    description: Application name (wps - wildfire predictive services)
    value: wps
  - name: MODULE_NAME
    description: Module name
    value: s3-backup
  - name: SUFFIX
    description: Deployment suffix, e.g. pr-### or prod
    required: true
  - name: GIT_URL
    value: https://github.com/bcgov/wps.git
  - name: GIT_BRANCH
    description: PR branch
    required: true
objects:
  - apiVersion: v1
    kind: ImageStream
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftNewBuild
      labels:
        app: ${APP_NAME}-${SUFFIX}
        common: "true"
      name: ${APP_NAME}-${MODULE_NAME}-${SUFFIX}
    spec:
      lookupPolicy:
        local: false
  - apiVersion: v1
    kind: BuildConfig
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftNewBuild
      labels:
        app: ${APP_NAME}-${SUFFIX}
      name: ${APP_NAME}-${MODULE_NAME}-${SUFFIX}
    spec:
      completionDeadlineSeconds: 600 # 10 minutes
      runPolicy: SerialLatestOnly
      output:
        to:
          kind: ImageStreamTag
          name: ${APP_NAME}-${MODULE_NAME}-${SUFFIX}:${SUFFIX}
      resources:
        limits:
          cpu: "2000m"
          memory: "512Mi"
        requests:
          cpu: "500m"
          memory: "256Mi"
      source:
        type: Git
        git:
          uri: ${GIT_URL}
          ref: origin/${GIT_BRANCH}
        contextDir: openshift/s3-backup/docker
      strategy:
        type: Docker
      triggers: []
