[project]
name = "s3-backup"
version = "0.1.0"
description = "Prune backup images"
authors = [{ name = "Sybrand Strauss", email = "sybrand.strauss@gov.bc.ca" }]
license = "Apache-2.0"
requires-python = ">=3.11.2"
dependencies = [
    # Pinned: aiobotocore >2.15 pulls in botocore >=1.36, whose default S3
    # integrity checksums are rejected by our Dell ECS object store (see #4941).
    "aiobotocore==2.15.2",
    "python-decouple>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "ruff>=0.17.0,<0.18",
]

[tool.uv]
package = false
