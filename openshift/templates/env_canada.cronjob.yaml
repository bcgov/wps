kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: ${JOB_NAME}-cronjob-template
  annotations:
    description: "Scheduled task to download and process weather data from the MSC Datamart through http protocol."
    tags: "cronjob,env-canada"
labels:
  app.kubernetes.io/part-of: "${NAME}"
  app: ${NAME}-${SUFFIX}
parameters:
  - name: NAME
    description: Module name
    value: wps
  - name: GLOBAL_NAME
    description: Name of global Module
    value: wps-global
  - name: SUFFIX
    description: Deployment suffix, e.g. pr-###
    required: true
  - name: PROJ_TOOLS
    value: e1e498-tools
  - name: JOB_NAME
    value: env-canada
  - name: MODEL
    description: Env Canada model to download/process (HRDPS, GDPS, or RDPS)
    required: true
  - name: IMAGE_REGISTRY
    required: true
    value: image-registry.openshift-image-registry.svc:5000
  - name: POSTGRES_DATABASE
    required: true
  - name: CRUNCHYDB_USER
    required: true
  - name: SCHEDULE
    required: true
  - name: WFWX_MAX_PAGE_SIZE
    description: Maximum number of entities to request at a time from the WFWX API
    value: "1000"
  - name: APP_LABEL
    required: true
  - name: PROJECT_NAMESPACE
    description: OpenShift project namespace
    required: true
  - name: MEMRAY_ENABLED
    description: >-
      When "true", wrap the job with memray to capture a memory allocation
      profile and upload it to the object store for OOM investigation
      (bcgov/wps#5637).
    value: "false"
  - name: MEMORY_REQUEST
    value: 512Mi
  - name: MEMORY_LIMIT
    value: 1Gi
  - name: MALLOC_ARENA_MAX
    description: >-
      glibc malloc arena cap, for OOM investigation (bcgov/wps#5637). Left
      unset (empty) by default, which glibc treats as "no limit" (unchanged
      default behaviour).
    value: ""
objects:
  - kind: CronJob
    apiVersion: batch/v1
    metadata:
      name: ${JOB_NAME}
    spec:
      # Don't run on the hour - as a courtesy to env canada, pick a random
      # number so that not everyone hits env. canada at the same time.
      schedule: ${SCHEDULE}
      # We use the "Forbid" policy, because cronjobs can take a long time to run, and it's possible
      # that a job will still be running when the next one is scheduled. If one job is still running,
      # we don't want to start another one, so we use "Forbid" so the running job will not be replaced.
      concurrencyPolicy: "Forbid"
      # Keep failed jobs (and their pods) around longer than the default (1) so there's
      # enough history to debug a failure before it gets garbage collected.
      failedJobsHistoryLimit: 5
      successfulJobsHistoryLimit: 3
      jobTemplate:
        metadata:
          labels:
            cronjob: ${JOB_NAME}
            app: ${APP_LABEL}
        spec:
          backoffLimit: 6
          template:
            spec:
              containers:
                - name: ${JOB_NAME}
                  image: ${IMAGE_REGISTRY}/${PROJ_TOOLS}/${NAME}-jobs-${SUFFIX}:${SUFFIX}
                  imagePullPolicy: "Always"
                  command:
                    - "sh"
                    - "-c"
                    - |
                      if [ "$MEMRAY_ENABLED" = "true" ]; then
                        OUTPUT_FILE=/data/memray-${MODEL}-$(date -u +%Y%m%dT%H%M%SZ).bin
                        uv run --no-sync memray run -f -o "$OUTPUT_FILE" -m weather_model_jobs.env_canada ${MODEL}
                        EXIT_CODE=$?
                        uv run --no-sync python -m weather_model_jobs.upload_memray_profile "$OUTPUT_FILE" ${MODEL} || true
                        exit $EXIT_CODE
                      else
                        exec uv run --no-sync python -m weather_model_jobs.env_canada ${MODEL}
                      fi
                  env:
                    - name: UV_NO_CACHE
                      value: "1"
                    - name: MEMRAY_ENABLED
                      value: ${MEMRAY_ENABLED}
                    - name: MALLOC_ARENA_MAX
                      value: ${MALLOC_ARENA_MAX}
                    - name: POSTGRES_READ_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: user
                    - name: POSTGRES_WRITE_USER
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: user
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: password
                    - name: POSTGRES_WRITE_HOST
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: pgbouncer-host
                    - name: POSTGRES_READ_HOST
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: pgbouncer-host
                    - name: POSTGRES_PORT
                      valueFrom:
                        secretKeyRef:
                          name: ${CRUNCHYDB_USER}
                          key: pgbouncer-port
                    - name: POSTGRES_DATABASE
                      value: ${POSTGRES_DATABASE}
                    - name: CHATOPS_URL
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: chatops-url
                    - name: CHATOPS_AUTH_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: chatops-auth-token
                    - name: OPENSHIFT_CONSOLE_URL
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.openshift-console-url
                    - name: PROJECT_NAMESPACE
                      value: ${PROJECT_NAMESPACE}
                    - name: WFWX_MAX_PAGE_SIZE
                      value: ${WFWX_MAX_PAGE_SIZE}
                    - name: WFWX_AUTH_URL
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.wfwx-auth-url
                    - name: WFWX_BASE_URL
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.wfwx-base-url
                    - name: WFWX_USER
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.wfwx-user
                    - name: WFWX_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: wfwx-secret
                    - name: REDIS_HOST
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-host
                    - name: REDIS_PORT
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-port
                    - name: REDIS_USE
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-use
                    - name: REDIS_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: wps-redis
                          key: database-password
                    - name: REDIS_STATION_CACHE_EXPIRY
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-station-cache-expiry
                    - name: REDIS_AUTH_CACHE_EXPIRY
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-auth-cache-expiry
                    - name: REDIS_DAILIES_BY_STATION_CODE_CACHE_EXPIRY
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-dailies-by-station-code-expiry
                    - name: REDIS_CACHE_ENV_CANADA
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.redis-cache-env-canada
                    - name: DATA_RETENTION_THRESHOLD
                      valueFrom:
                        configMapKeyRef:
                          name: ${GLOBAL_NAME}
                          key: env.data_retention_threshold
                    - name: OBJECT_STORE_SERVER
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: object-store-server
                    - name: OBJECT_STORE_USER_ID
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: object-store-user-id
                    - name: OBJECT_STORE_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: object-store-secret
                    - name: OBJECT_STORE_BUCKET
                      valueFrom:
                        secretKeyRef:
                          name: ${GLOBAL_NAME}
                          key: object-store-bucket
                  resources:
                    limits:
                      memory: ${MEMORY_LIMIT}
                    requests:
                      cpu: "500m"
                      memory: ${MEMORY_REQUEST}
              restartPolicy: OnFailure
