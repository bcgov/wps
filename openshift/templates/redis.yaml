kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    template.alpha.openshift.io/wait-for-ready: "true"
    image.openshift.io/triggers: |-
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "redis:6-el9",
            "namespace": openshift
          },
          "fieldPath": "spec.template.spec.containers[0].image"
        }
      ]
  name: wps-redis
  labels:
    template: redis-ephemeral-template
spec:
  replicas: 1
  selector:
    matchLabels:
      name: wps-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: wps-redis
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: wps-redis-data
          emptyDir: {}
      containers:
        - name: redis
          image: >-
            image-registry.openshift-image-registry.svc:5000/openshift/redis@sha256:e12fc5970148659b3f3ac9d80799beb36138d559830f36ac2319e6ff606cefc3
          args:
            - /usr/bin/run-redis
            - --maxmemory
            - 1536mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wps-redis
                  key: database-password
          resources:
            limits:
              memory: 2Gi
              ephemeral-storage: "2.5Gi"
            requests:
              memory: 512Mi
              ephemeral-storage: "2Gi"
              cpu: 100m
          volumeMounts:
            - name: wps-redis-data
              mountPath: /var/lib/redis/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - "-c"
                - >-
                  test "$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping)" = "PONG"
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            capabilities: {}
            privileged: false
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
