apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
  annotations:
    description: PostgreSQL metrics exporter for Sysdig Monitor
parameters:
  - name: SUFFIX
    description: Deployment suffix, either prod or pr-####
    required: true
  - name: CRUNCHY_NAME
    description: Crunchy PostgreSQL cluster name prefix
    value: wps-crunchydb-16
  - name: PROJECT_NAMESPACE
    description: OpenShift project namespace
    required: true
  - name: POSTGRES_DATABASE
    description: PostgreSQL database monitored by the exporter
    value: wps
  - name: EXPORTER_IMAGE
    description: PostgreSQL exporter container image
    value: quay.io/sysdig/postgresql-exporter:v0.11.35-ubi
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}-queries
      namespace: ${PROJECT_NAMESPACE}
      labels:
        app.kubernetes.io/name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
        app.kubernetes.io/part-of: wps
    data:
      queries.yaml: |
        pg_replication:
          query: "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) as lag"
          master: true
          metrics:
            - lag:
                usage: "GAUGE"
                description: "Replication lag behind master in seconds"

        pg_postmaster:
          query: "SELECT pg_postmaster_start_time as start_time_seconds from pg_postmaster_start_time()"
          master: true
          metrics:
            - start_time_seconds:
                usage: "GAUGE"
                description: "Time at which postmaster started"

        pg_stat_user_tables:
          query: "SELECT current_database() datname, schemaname, relname, seq_scan, seq_tup_read, idx_scan, idx_tup_fetch, n_tup_ins, n_tup_upd, n_tup_del, n_tup_hot_upd, n_live_tup, n_dead_tup, n_mod_since_analyze, COALESCE(last_vacuum, '1970-01-01Z') as last_vacuum, COALESCE(last_autovacuum, '1970-01-01Z') as last_autovacuum, COALESCE(last_analyze, '1970-01-01Z') as last_analyze, COALESCE(last_autoanalyze, '1970-01-01Z') as last_autoanalyze, vacuum_count, autovacuum_count, analyze_count, autoanalyze_count FROM pg_stat_user_tables"
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of current database"
            - schemaname:
                usage: "LABEL"
                description: "Name of the schema that this table is in"
            - relname:
                usage: "LABEL"
                description: "Name of this table"
            - seq_scan:
                usage: "COUNTER"
                description: "Number of sequential scans initiated on this table"
            - seq_tup_read:
                usage: "COUNTER"
                description: "Number of live rows fetched by sequential scans"
            - idx_scan:
                usage: "COUNTER"
                description: "Number of index scans initiated on this table"
            - idx_tup_fetch:
                usage: "COUNTER"
                description: "Number of live rows fetched by index scans"
            - n_tup_ins:
                usage: "COUNTER"
                description: "Number of rows inserted"
            - n_tup_upd:
                usage: "COUNTER"
                description: "Number of rows updated"
            - n_tup_del:
                usage: "COUNTER"
                description: "Number of rows deleted"
            - n_tup_hot_upd:
                usage: "COUNTER"
                description: "Number of rows HOT updated (i.e., with no separate index update required)"
            - n_live_tup:
                usage: "GAUGE"
                description: "Estimated number of live rows"
            - n_dead_tup:
                usage: "GAUGE"
                description: "Estimated number of dead rows"
            - n_mod_since_analyze:
                usage: "GAUGE"
                description: "Estimated number of rows changed since last analyze"
            - last_vacuum:
                usage: "GAUGE"
                description: "Last time at which this table was manually vacuumed (not counting VACUUM FULL)"
            - last_autovacuum:
                usage: "GAUGE"
                description: "Last time at which this table was vacuumed by the autovacuum daemon"
            - last_analyze:
                usage: "GAUGE"
                description: "Last time at which this table was manually analyzed"
            - last_autoanalyze:
                usage: "GAUGE"
                description: "Last time at which this table was analyzed by the autovacuum daemon"
            - vacuum_count:
                usage: "COUNTER"
                description: "Number of times this table has been manually vacuumed (not counting VACUUM FULL)"
            - autovacuum_count:
                usage: "COUNTER"
                description: "Number of times this table has been vacuumed by the autovacuum daemon"
            - analyze_count:
                usage: "COUNTER"
                description: "Number of times this table has been manually analyzed"
            - autoanalyze_count:
                usage: "COUNTER"
                description: "Number of times this table has been analyzed by the autovacuum daemon"

        pg_statio_user_tables:
          query: "SELECT current_database() datname, schemaname, relname, heap_blks_read, heap_blks_hit, idx_blks_read, idx_blks_hit, toast_blks_read, toast_blks_hit, tidx_blks_read, tidx_blks_hit FROM pg_statio_user_tables"
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of current database"
            - schemaname:
                usage: "LABEL"
                description: "Name of the schema that this table is in"
            - relname:
                usage: "LABEL"
                description: "Name of this table"
            - heap_blks_read:
                usage: "COUNTER"
                description: "Number of disk blocks read from this table"
            - heap_blks_hit:
                usage: "COUNTER"
                description: "Number of buffer hits in this table"
            - idx_blks_read:
                usage: "COUNTER"
                description: "Number of disk blocks read from all indexes on this table"
            - idx_blks_hit:
                usage: "COUNTER"
                description: "Number of buffer hits from all indexes on this table"
            - toast_blks_read:
                usage: "COUNTER"
                description: "Number of disk blocks read from this table's TOAST table (if any)"
            - toast_blks_hit:
                usage: "COUNTER"
                description: "Number of buffer hits from this table's TOAST table (if any)"
            - tidx_blks_read:
                usage: "COUNTER"
                description: "Number of disk blocks read from this table's TOAST table indexes (if any)"
            - tidx_blks_hit:
                usage: "COUNTER"
                description: "Number of buffer hits from this table's TOAST table indexes (if any)"

        pg_database:
          query: "SELECT pg_database.datname, pg_database_size(pg_database.datname) as size_bytes FROM pg_database"
          master: true
          cache_seconds: 30
          metrics:
            - datname:
                usage: "LABEL"
                description: "Name of the database"
            - size_bytes:
                usage: "GAUGE"
                description: "Disk space used by the database"

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
      namespace: ${PROJECT_NAMESPACE}
      labels:
        app.kubernetes.io/name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
        app.kubernetes.io/part-of: wps
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
      template:
        metadata:
          annotations:
            promcat.sysdig.com/port: "9187"
            promcat.sysdig.com/target_ns: ${PROJECT_NAMESPACE}
            promcat.sysdig.com/integration_type: postgresql
          labels:
            app.kubernetes.io/name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}
            app.kubernetes.io/part-of: wps
        spec:
          containers:
            - name: postgresql-exporter
              image: ${EXPORTER_IMAGE}
              imagePullPolicy: IfNotPresent
              ports:
                - name: metrics
                  containerPort: 9187
              readinessProbe:
                httpGet:
                  path: /
                  port: 9187
              env:
                - name: DATA_SOURCE_URI
                  value: ${CRUNCHY_NAME}-${SUFFIX}-primary.${PROJECT_NAMESPACE}.svc:5432/${POSTGRES_DATABASE}?sslmode=require
                - name: DATA_SOURCE_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${CRUNCHY_NAME}-${SUFFIX}-pguser-sysdig-monitor
                      key: user
                - name: DATA_SOURCE_PASS
                  valueFrom:
                    secretKeyRef:
                      name: ${CRUNCHY_NAME}-${SUFFIX}-pguser-sysdig-monitor
                      key: password
                - name: PG_EXPORTER_EXTEND_QUERY_PATH
                  value: /tmp/queries.yaml
                - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
                  value: "false"
                - name: PG_EXPORTER_EXCLUDE_DATABASES
                  value: ""
                - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
                  value: "false"
              volumeMounts:
                - name: postgres-queries
                  mountPath: /tmp/queries.yaml
                  subPath: queries.yaml
          volumes:
            - name: postgres-queries
              configMap:
                name: postgresql-exporter-${CRUNCHY_NAME}-${SUFFIX}-queries
                defaultMode: 420
