apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The main API + web Deployment, 2 Services, and 4 Routes. Generated from
# openshift/templates/deploy.yaml via `oc process --local` (see generate.py in this
# directory), same convention as base/cronjobs. __SUFFIX__/__NAMESPACE__/__DEPLOY_VERSION__
# are literal placeholder tokens substituted by the caller at apply time (see
# openshift/kustomize/README.md).
#
# Note: the Deployment object carries `targetRef`/`updatePolicy` keys directly under `spec:`
# (apparently a leftover from an attempted VerticalPodAutoscaler that got merged into the
# Deployment instead of added as its own object) -- confirmed this is what the source
# template already renders via `oc process --local`; reproduced faithfully here, not fixed.
resources:
  - api.yaml
