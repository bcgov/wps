apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dedicated SFMS Daily FWI API service used behind APS (Deployment + Service). Generated
# from openshift/templates/sfms_fwi_api.yaml via `oc process --local` (see generate.py in
