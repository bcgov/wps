apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: wps-__SUFFIX__
    app.kubernetes.io/part-of: wps
    wps.bcgov/env-global: 'true'
    wps.bcgov/env-uv: 'true'
    wps.bcgov/env-postgres: 'true'
    wps.bcgov/env-redis: 'true'
    wps.bcgov/env-wfwx: 'true'
  name: noaa-nam-wps-__SUFFIX__
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app: wps-__SUFFIX__
        cronjob: noaa-nam-wps-__SUFFIX__
    spec:
      backoffLimit: 6
      template:
        spec:
          containers:
          - command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - weather_model_jobs.noaa
            - NAM
            env:
            - name: POSTGRES_DATABASE
              value: wps
            - name: PROJECT_NAMESPACE
              value: __NAMESPACE__
            - name: WFWX_MAX_PAGE_SIZE
              value: ${WFWX_MAX_PAGE_SIZE}
            - name: REDIS_DAILIES_BY_STATION_CODE_CACHE_EXPIRY
              valueFrom:
                configMapKeyRef:
                  key: env.redis-dailies-by-station-code-expiry
                  name: wps-global
            - name: REDIS_CACHE_NOAA
              valueFrom:
                configMapKeyRef:
                  key: env.redis-cache-noaa
                  name: wps-global
            - name: DATA_RETENTION_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  key: env.data_retention_threshold
                  name: wps-global
            image: image-registry.openshift-image-registry.svc:5000/e1e498-tools/wps-jobs-__SUFFIX__:__SUFFIX__
            imagePullPolicy: Always
            name: noaa-nam-wps-__SUFFIX__
            resources:
              limits:
                memory: 1024Mi
              requests:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
  schedule: 29 */4 * * *
  successfulJobsHistoryLimit: 3
