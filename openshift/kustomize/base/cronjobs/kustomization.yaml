apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 20 independent CronJobs -- same set already batched into one `oc apply` on
# harden-oc-deploys; this replaces that hand-rolled batching with the standard tool.
# Generated from openshift/templates/*.cronjob.yaml via `oc process --local` (see
# generate.py in this directory) rather than transcribed by hand, to avoid copy errors
# across ~20 templates. __SUFFIX__ and __NAMESPACE__ are literal placeholder tokens
# substituted by the caller at apply time (see openshift/kustomize/README.md) -- SUFFIX
# is genuinely dynamic per CI run in both environments, so it can't be baked in here
# the way the rest of these values can.
resources:
  - ecmwf.yaml
  - env-canada-gdps.yaml
  - env-canada-hrdps.yaml
  - env-canada-rdps.yaml
  - fire-watch-weather.yaml
  - grass-curing.yaml
  - hourly-prune.yaml
  - noaa-gfs.yaml
  - noaa-nam.yaml
  - partitioner.yaml
  - rdps-sfms.yaml
  - s3-data-retention.yaml
  - sfms-daily-actuals.yaml
  - sfms-forecast-545pm.yaml
  - sfms-forecast-8am.yaml
  - sfms-fwi-calc.yaml
  - viirs-snow.yaml
  - wfwx-hourly-actuals.yaml
  - wfwx-noon-forecasts.yaml
  - wx-4panel-charts-gdps.yaml
  - wx-4panel-charts-rdps.yaml

# Env vars baked identically into several Templates (same wps-global/wps-redis/wps-crunchydb
# secrets, referenced the same way) -- deduped out of the base files above via generate.py
# and reattached here as JSON6902 "append to env" patches, targeted by the label generate.py
# adds only where a resource's whole group matched byte-for-byte. See generate.py's
# COMMON_ENV_GROUPS for which vars are in each group and why JSON6902 (not strategic merge).
patches:
  - path: env-global.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-global=true
  - path: env-uv.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-uv=true
  - path: env-postgres.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-postgres=true
  - path: env-redis.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-redis=true
  - path: env-wfwx.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-wfwx=true
  - path: env-objectstore.patch.yaml
    target:
      kind: CronJob
      labelSelector: wps.bcgov/env-objectstore=true
