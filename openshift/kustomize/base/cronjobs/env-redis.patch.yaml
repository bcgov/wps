- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_HOST
    valueFrom:
      configMapKeyRef:
        key: env.redis-host
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_PORT
    valueFrom:
      configMapKeyRef:
        key: env.redis-port
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_USE
    valueFrom:
      configMapKeyRef:
        key: env.redis-use
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        key: database-password
        name: wps-redis
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_STATION_CACHE_EXPIRY
    valueFrom:
      configMapKeyRef:
        key: env.redis-station-cache-expiry
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: REDIS_AUTH_CACHE_EXPIRY
    valueFrom:
      configMapKeyRef:
        key: env.redis-auth-cache-expiry
        name: wps-global
