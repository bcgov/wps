apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: wps-__SUFFIX__
    app.kubernetes.io/part-of: wps
    wps.bcgov/env-global: 'true'
    wps.bcgov/env-uv: 'true'
    wps.bcgov/env-postgres: 'true'
    wps.bcgov/env-redis: 'true'
    wps.bcgov/env-wfwx: 'true'
    wps.bcgov/env-objectstore: 'true'
  name: sfms-daily-actuals-wps-__SUFFIX__
spec:
  concurrencyPolicy: Replace
  jobTemplate:
    metadata:
      labels:
        app: wps-__SUFFIX__
        cronjob: sfms-daily-actuals-wps-__SUFFIX__
    spec:
      template:
        spec:
          containers:
          - command:
            - uv
            - run
            - --package
            - wps-api
            - --no-sync
            - python
            - -m
            - app.jobs.sfms_daily_actuals
            env: []
            image: image-registry.openshift-image-registry.svc:5000/e1e498-tools/wps-api-__SUFFIX__:__SUFFIX__
            imagePullPolicy: Always
            name: sfms-daily-actuals-wps-__SUFFIX__
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 1Gi
          restartPolicy: OnFailure
  schedule: 59 * * * *
