apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: wps-__SUFFIX__
    app.kubernetes.io/part-of: wps
    app.wps/env-global: 'true'
    app.wps/env-uv: 'true'
    app.wps/env-postgres: 'true'
    app.wps/env-redis: 'true'
    app.wps/env-wfwx: 'true'
    app.wps/env-objectstore: 'true'
    app.wps/env-redis-cache-env-canada: 'true'
  name: rdps-sfms-wps-__SUFFIX__
spec:
  concurrencyPolicy: Replace
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app: wps-__SUFFIX__
        cronjob: rdps-sfms-wps-__SUFFIX__
    spec:
      backoffLimit: 6
      template:
        spec:
          containers:
          - command:
            - uv
            - run
            - --package
            - wps-api
            - --no-sync
            - python
            - -m
            - app.jobs.rdps_sfms
            env: []
            image: image-registry.openshift-image-registry.svc:5000/e1e498-tools/wps-api-__SUFFIX__:__SUFFIX__
            imagePullPolicy: Always
            name: rdps-sfms-wps-__SUFFIX__
            resources:
              limits:
                memory: 1024Mi
              requests:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
  schedule: 49 * * * *
  successfulJobsHistoryLimit: 3
