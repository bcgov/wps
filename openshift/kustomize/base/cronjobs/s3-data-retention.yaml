apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: wps-__SUFFIX__
    app.kubernetes.io/part-of: wps
    wps.bcgov/env-uv: 'true'
  name: s3-retention-wps-__SUFFIX__
spec:
  concurrencyPolicy: Replace
  jobTemplate:
    metadata:
      labels:
        app: wps-__SUFFIX__
        cronjob: s3-retention-wps-__SUFFIX__
    spec:
      template:
        spec:
          containers:
          - command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - wps_weather.s3_data_retention
            env:
            - name: OBJECT_STORE_SERVER
              valueFrom:
                secretKeyRef:
                  key: object-store-server
                  name: wps-global
            - name: WX_OBJECT_STORE_USER_ID
              valueFrom:
                secretKeyRef:
                  key: wx-object-store-user-id
                  name: wps-global
            - name: WX_OBJECT_STORE_SECRET
              valueFrom:
                secretKeyRef:
                  key: wx-object-store-secret
                  name: wps-global
            - name: WX_OBJECT_STORE_BUCKET
              valueFrom:
                secretKeyRef:
                  key: wx-object-store-bucket
                  name: wps-global
            - name: GRIB_RETENTION_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  key: env.grib_retention_threshold
                  name: wps-global
            image: image-registry.openshift-image-registry.svc:5000/e1e498-tools/wps-weather-__SUFFIX__:__SUFFIX__
            imagePullPolicy: Always
            name: s3-retention-wps-__SUFFIX__
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 150m
                memory: 100Mi
          restartPolicy: OnFailure
  schedule: 20 * * * *
