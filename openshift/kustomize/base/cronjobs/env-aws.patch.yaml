- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: object-store-user-id
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: AWS_BUCKET
    valueFrom:
      secretKeyRef:
        key: object-store-bucket
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: AWS_HOSTNAME
    valueFrom:
      secretKeyRef:
        key: object-store-server
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_KEY
    valueFrom:
      secretKeyRef:
        key: object-store-secret
        name: wps-global
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: SUFFIX
    value: __SUFFIX__
