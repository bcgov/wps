apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two NetworkPolicies that let the APS gateway reach the ASA Go and SFMS FWI API pods.
# Generated from openshift/templates/allow_gateway_to_*.yaml via `oc process --local` (see
# generate.py in this directory), same convention as base/cronjobs. Neither has any env
# vars or cross-resource duplication, so there's nothing to dedupe here the way cronjobs
# needed. __SUFFIX__ is a literal placeholder substituted by the caller at apply time (see
# openshift/kustomize/README.md).
resources:
  - allow-gateway-to-wps-asa-go-api.yaml
  - allow-gateway-to-wps-sfms-fwi-api.yaml
