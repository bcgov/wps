apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: e1e498-dev

resources:
  - ../../base/cronjobs
  - ../../base/networkpolicies
  - ../../base/jobs

# Dev-specific overrides. Every value here is taken directly from the explicit
# MEMORY_REQUEST/MEMORY_LIMIT overrides in deployment.yml's "Provision dev cronjobs and
# jobs" step (harden-oc-deploys) -- everything not listed here uses the base's (the
# template's own default) values unchanged, same as dev always has for those.
patches:
  - target:
      kind: CronJob
      name: sfms-daily-actuals-wps-__SUFFIX__
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: CronJob
      name: sfms-forecast-wps-__SUFFIX__-8am
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: CronJob
      name: sfms-forecast-wps-__SUFFIX__-545pm
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  # Dev uses much shorter forecast horizons than prod -- not just a resource-size
  # difference, this changes the actual command args (--end_hour/--step), confirmed
  # against the rendered container command array before writing this patch.
  - target:
      kind: CronJob
      name: wx-4panel-charts-gdps-wps-__SUFFIX__
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/9
        value: "48"
  - target:
      kind: CronJob
      name: wx-4panel-charts-rdps-wps-__SUFFIX__
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/9
        value: "15"
