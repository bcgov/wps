name: ASA Go Setup
description: Install Node.js, build the keycloak plugin, and install asa-go dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js environment
      id: setup-node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # use Corepack to select the Yarn version pinned by each mobile project
    - name: Install Corepack
      working-directory: ./web
      shell: bash
      run: |
        npm install --global --ignore-scripts \
          "corepack@$(node -p 'require("./package.json").devDependencies.corepack')"
        corepack enable

    - uses: actions/cache@v6
      id: asa-go-keycloak-cache
      with:
        path: |
          mobile/keycloak/node_modules
          mobile/keycloak/.yarn/install-state.gz
          ~/.yarn/berry/cache
        key: ${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-keycloak-${{ hashFiles('mobile/.yarnrc.yml', 'mobile/keycloak/package.json', 'mobile/keycloak/yarn.lock') }}

    - name: Install keycloak plugin
      working-directory: ./mobile/keycloak
      shell: bash
      run: yarn install --immutable

    - name: Build keycloak plugin
      working-directory: ./mobile/keycloak
      shell: bash
      run: yarn build

    - uses: actions/cache@v6
      id: asa-go-cache
      with:
        path: |
          mobile/asa-go/node_modules
          mobile/asa-go/.yarn/install-state.gz
          ~/.yarn/berry/cache
        key: ${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-asa-go-${{ hashFiles('mobile/.yarnrc.yml', 'mobile/asa-go/package.json', 'mobile/asa-go/yarn.lock', 'mobile/keycloak/package.json', 'mobile/keycloak/yarn.lock') }}

    - name: Install dependencies
      working-directory: ./mobile/asa-go
      shell: bash
      run: yarn install --immutable
