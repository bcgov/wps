name: Python Setup
description: Install uv and Python dependencies

inputs:
  install-jdk:
    description: Whether to install JDK
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"

    - name: Install JDK
      if: inputs.install-jdk == 'true'
      shell: bash
      run: |
        apt-get update --fix-missing
        apt-get -y install default-jdk-headless

    # setup-uv restores the uv cache, so this takes seconds
    - name: Install python dependencies using uv
      working-directory: ./backend
      shell: bash
      run: |
        uv sync --all-extras --locked
        uv pip install setuptools
        uv pip install --no-build-isolation gdal==$(gdal-config --version)
