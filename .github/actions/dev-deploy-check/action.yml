name: Check dev deployment
description: Check current PR labels and dev quota before provisioning

inputs:
  oc-server:
    description: OpenShift server URL
    required: true
  oc-token:
    description: Dev service account token
    required: true

outputs:
  deploy:
    description: Whether this run may provision dev resources
    # default to false when the PR state check skips the capacity step
    value: ${{ steps.capacity.outputs.deploy || 'false' }}

runs:
  using: composite
  steps:
    - name: Check current PR state
      id: state
      uses: actions/github-script@v9
      with:
        script: |
          // queued runs may outlive the event's PR state, so fetch the current PR
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
          });
          const deploy = pr.state === 'open'
            && pr.head.sha === context.payload.pull_request.head.sha
            && !pr.labels.some(label => label.name === 'skip-dev-deploy');
          core.setOutput('deploy', deploy);
          if (!deploy) {
            await core.summary.addRaw('Dev deployment skipped. The PR is paused, closed, or this run targets an older commit.').write();
          }

    # paused, closed, and outdated PRs need no cluster access; image builds run independently
    - uses: ./.github/actions/oc-setup
      if: steps.state.outputs.deploy == 'true'

    - uses: ./.github/actions/oc-login
      if: steps.state.outputs.deploy == 'true'
      with:
        oc-server: ${{ inputs.oc-server }}
        oc-token: ${{ inputs.oc-token }}
        oc-namespace: e1e498-dev

    - name: Check available dev quota
      id: capacity
      if: steps.state.outputs.deploy == 'true'
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 openshift/scripts/check_dev_capacity.py "${PR_NUMBER}"

    # read errors fail the check without setting deploy=false, so they never add the label
    - name: Pause deployment when capacity is insufficient
      if: steps.capacity.outputs.deploy == 'false'
      uses: actions/github-script@v9
      with:
        script: |
          // the label is created once during setup and only pauses future deployments
          await github.rest.issues.addLabels({
            ...context.repo,
            issue_number: context.payload.pull_request.number,
            labels: ['skip-dev-deploy'],
          });
