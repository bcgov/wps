name: Deploy WPS Weather

# jobs explicitly request the token permissions they need
permissions: {}

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
    paths:
      - "backend/packages/wps-weather/**"

env:
  SUFFIX: pr-${{ github.event.number }}

jobs:
  deploy-requested:
    name: Dev deployment requested
    # require deploy-dev to avoid exhausting shared dev resources
    if: contains(github.event.pull_request.labels.*.name, 'deploy-dev')
    runs-on: ubuntu-26.04
    steps:
      - run: echo "Dev deployment requested"

  build-image:
    name: Build Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        if: github.event.action == 'labeled'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # avoid rebuilding on label events when this commit already has an image
      - name: Check for reusable Weather image
        id: reuse
        if: github.event.action == 'labeled'
        shell: bash
        env:
          REUSE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          IMAGE="ghcr.io/bcgov/wps/wps-weather:${SUFFIX}"

          if IMAGE_CONFIG=$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Image}}'); then
            IMAGE_COMMIT=$(jq -r '(.["linux/amd64"] // .).config.Labels["org.opencontainers.image.revision"] // ""' <<<"${IMAGE_CONFIG}")
            if [ "${IMAGE_COMMIT}" = "${REUSE_COMMIT}" ]; then
              echo "Reusing image ${IMAGE} for commit ${REUSE_COMMIT}"
              echo "matches=true" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Build and push WPS Weather image
        if: steps.reuse.outputs.matches != 'true'
        uses: bcgov/actions/builder@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: wps-weather
          context: .
          file: backend/packages/wps-weather/Dockerfile
          tags: ${{ env.SUFFIX }}

  deployments:
    name: Deployments
    needs: [build-image, deploy-requested]
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Provision S3 Retention Cronjob
        shell: bash
        run: |
          bash openshift/scripts/oc_provision_s3_data_retention.sh ${SUFFIX} | oc -n e1e498-dev apply -f -

      - name: Deploy ECCC Consumer
        shell: bash
        run: |
          DEPLOY_VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" bash openshift/scripts/oc_provision_eccc_grib_consumer.sh ${SUFFIX} apply
