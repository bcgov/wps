name: Deploy WPS Weather

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
    paths:
      - "backend/packages/wps-weather/**"

env:
  SUFFIX: pr-${{ github.event.number }}

jobs:
  build-image:
    name: Build Image
    if: github.event.action != 'labeled' || github.event.label.name == 'deploy-dev'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and push WPS Weather image
        uses: bcgov/actions/builder@091f1da89c669d36bf4899830381e5b12d2c889a # v0.11.0
        with:
          package: wps-weather
          context: .
          file: backend/packages/wps-weather/Dockerfile
          tags: ${{ env.SUFFIX }}

  deployments:
    name: Deployments
    needs: [build-image]
    # image builds run without the label; only provisioning requires it
    if: >-
      contains(github.event.pull_request.labels.*.name, 'deploy-dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-dev')
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Provision S3 Retention Cronjob
        shell: bash
        run: |
          bash openshift/scripts/oc_provision_s3_data_retention.sh ${SUFFIX} | oc -n e1e498-dev apply -f -

      - name: Deploy ECCC Consumer
        shell: bash
        run: |
          DEPLOY_VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" bash openshift/scripts/oc_provision_eccc_grib_consumer.sh ${SUFFIX} apply
