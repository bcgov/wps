name: Deployment

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/asa_go_android_build.yml"
      - ".github/workflows/asa_go_ios_build_deploy.yml"

env:
  APS_TEST_GATEWAY_ID: gw-11008
  SUFFIX: pr-${{ github.event.number }}

jobs:
  prepare-dev-database:
    name: Prepare Dev Database
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Deploy CrunchyDB cluster
        shell: bash
        run: |
          EPHEMERAL_STORAGE=True BUCKET=gpdqha DATA_SIZE=5Gi WAL_SIZE=5Gi REPLICAS="2" bash openshift/scripts/oc_provision_crunchy.sh ${SUFFIX} apply

  build-image:
    name: Build ${{ matrix.name }} Image
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            module: web
            docker_file: Dockerfile.web
            path_bc: openshift/templates/build.web.bc.yaml
            sentry: true
          - name: API
            module: api
            docker_file: Dockerfile
            path_bc: openshift/templates/build.bc.yaml
          - name: WPS Jobs
            module: jobs
            docker_file: Dockerfile.jobs
            path_bc: openshift/templates/wps_jobs/wps_jobs_build.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_TOOL_TOKEN }}
          oc-namespace: e1e498-tools

      - name: Build wps-${{ matrix.module }} Image
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ matrix.sentry && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          GIT_BRANCH=${GITHUB_HEAD_REF} \
            MODULE_NAME=${{ matrix.module }} \
            ${{ matrix.docker_file && format('DOCKER_FILE={0}', matrix.docker_file) || '' }} \
            ${{ matrix.path_bc && format('PATH_BC={0}', matrix.path_bc) || '' }} \
            bash openshift/scripts/oc_build.sh ${SUFFIX} apply

      # Copy of the OpenShift-built image for running outside OpenShift. OpenShift still pulls from
      # its internal registry, so a GHCR outage must not block deploys. Set PUSH_GHCR=false to skip.
      # oc-login tokens expire after 10 minutes, which the build above can outlast
      - uses: ./.github/actions/oc-login
        if: vars.PUSH_GHCR != 'false'
        continue-on-error: true
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_TOOL_TOKEN }}
          oc-namespace: e1e498-tools

      - name: Log in to GitHub Container Registry
        if: vars.PUSH_GHCR != 'false'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror wps-${{ matrix.module }} Image to GHCR
        id: ghcr_mirror
        if: vars.PUSH_GHCR != 'false'
        continue-on-error: true
        shell: bash
        run: |
          oc registry login --registry=image-registry.apps.silver.devops.gov.bc.ca
          oc image mirror \
            image-registry.apps.silver.devops.gov.bc.ca/e1e498-tools/wps-${{ matrix.module }}-${SUFFIX}:${SUFFIX} \
            ghcr.io/bcgov/wps/wps-${{ matrix.module }}:${SUFFIX}-run${{ github.run_id }}-amd64

      # The mirror steps don't fail the job, so surface failures as a warning on the run and PR checks
      - name: Warn on GHCR mirror failure
        if: steps.ghcr_mirror.outcome == 'failure'
        run: echo "::warning title=GHCR mirror failed::wps-${{ matrix.module }}:${SUFFIX} was not mirrored to GHCR. OpenShift deploy is unaffected."

  # OpenShift can only build amd64, so the arm64 half of the GHCR image (for Apple Silicon) is built
  # here from the same commit. Only GHCR uses it; OpenShift never pulls it.
  build-image-arm64:
    name: Build ${{ matrix.name }} arm64 Image
    if: vars.PUSH_GHCR != 'false'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            module: web
            docker_file: Dockerfile.web
          # Dockerfiles default DOCKER_IMAGE to the OpenShift base, which is amd64-only and not
          # reachable from here, so point them at the multi-arch GHCR base instead
          - name: API
            module: api
            docker_file: Dockerfile
            base_image: ghcr.io/bcgov/wps/wps-api-base:pr-5899-10-07-2026@sha256:ead22e60df1e0d638bc534d7ff5a308d4cd02520ece2b6f7b6d5b87fd0bf9d0a
          - name: WPS Jobs
            module: jobs
            docker_file: Dockerfile.jobs
            base_image: ghcr.io/bcgov/wps/wps-jobs-base:pr-5899-10-07-2026@sha256:ae9f5d50dd2c37bd82567d418f95ddebbabd7a5b694d782574b3d006559dbe84
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push wps-${{ matrix.module }} arm64 Image
        env:
          TAG: ghcr.io/bcgov/wps/wps-${{ matrix.module }}:${{ env.SUFFIX }}-run${{ github.run_id }}-arm64
        run: |
          docker build . --file ${{ matrix.docker_file }} --tag ${TAG} \
            ${{ matrix.base_image && format('--build-arg DOCKER_IMAGE={0}', matrix.base_image) || '' }}
          docker push ${TAG}

  publish-ghcr-image:
    name: Publish wps-${{ matrix.module }} Multi-arch Image to GHCR
    needs: [build-image, build-image-arm64]
    if: ${{ !cancelled() && vars.PUSH_GHCR != 'false' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [web, api, jobs]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 is the image OpenShift runs, so it's required: without it, keep the previous tag rather
      # than publish arm64 only. arm64 is optional and is left out with a warning if it failed.
      - name: Create Multi-arch Manifest
        env:
          IMAGE: ghcr.io/bcgov/wps/wps-${{ matrix.module }}
        run: |
          amd64="${IMAGE}:${SUFFIX}-run${{ github.run_id }}-amd64"
          arm64="${IMAGE}:${SUFFIX}-run${{ github.run_id }}-arm64"
          if ! docker buildx imagetools inspect "${amd64}" >/dev/null 2>&1; then
            echo "::warning title=GHCR publish skipped::wps-${{ matrix.module }}:${SUFFIX} has no amd64 build, so the previous tag was kept. OpenShift deploy is unaffected."
            exit 1
          fi
          sources=("${amd64}")
          if docker buildx imagetools inspect "${arm64}" >/dev/null 2>&1; then
            sources+=("${arm64}")
          else
            echo "::warning title=GHCR image incomplete::wps-${{ matrix.module }}:${SUFFIX} has no arm64 build. OpenShift deploy is unaffected."
          fi
          docker buildx imagetools create --tag "${IMAGE}:${SUFFIX}" "${sources[@]}"

  configure-nats-server-name:
    name: Configure nats server name
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Configure
        shell: bash
        run: bash openshift/scripts/oc_provision_nats_server_config.sh ${SUFFIX} apply

  deploy-dev-queue:
    name: Deploy Message Queue to Dev
    if: github.triggering_actor != 'renovate'
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    needs: [build-image, configure-nats-server-name]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: NATS Message Queue
        shell: bash
        run: |
          MEMORY_REQUEST=512Mi MEMORY_LIMIT=1Gi CPU_REQUEST="250m" REPLICAS=2 ENVIRONMENT="development" bash openshift/scripts/oc_provision_nats.sh ${SUFFIX} apply

  deploy-dev:
    name: Deploy to Dev
    if: github.triggering_actor != 'renovate'
    needs:
      [
        build-image,
        prepare-dev-database,
        deploy-dev-queue,
        configure-nats-server-name,
      ]
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Deploy API to Dev
        shell: bash
        run: |
          DEPLOY_VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" MODULE_NAME=api SECOND_LEVEL_DOMAIN="apps.silver.devops.gov.bc.ca" VANITY_DOMAIN="${SUFFIX}-dev-psu.apps.silver.devops.gov.bc.ca" ENVIRONMENT="development" bash openshift/scripts/oc_deploy.sh ${SUFFIX} apply

      - name: Provision dev cronjobs and jobs
        shell: bash
        run: |
          FUEL_RASTER_YEAR=2026 bash openshift/scripts/oc_provision_fuel_grid_install_job.sh ${SUFFIX} apply

          # Temporary batch file to apply all cronjobs in one call, to avoid hitting the OpenShift API rate limit.
          BATCH_FILE=$(mktemp)
          bash openshift/scripts/oc_provision_wfwx_hourly_actuals_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_ec_gdps_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_ec_hrdps_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_ec_rdps_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_noaa_gfs_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_noaa_nam_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_ecmwf_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_viirs_snow_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_grass_curing_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_rdps_sfms_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_sfms_calculations_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_fire_watch_weather_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          bash openshift/scripts/oc_provision_hourly_prune_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          MEMORY_REQUEST=512Mi MEMORY_LIMIT=1Gi bash openshift/scripts/oc_provision_sfms_daily_actuals_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          # 15:00 UTC (8:00 AM PDT)
          MEMORY_REQUEST=512Mi MEMORY_LIMIT=1Gi JOB_SUFFIX=8am SCHEDULE="0 15 * * *" bash openshift/scripts/oc_provision_sfms_daily_forecasts_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          # 00:45 UTC (5:45 PM PDT)
          MEMORY_REQUEST=512Mi MEMORY_LIMIT=1Gi JOB_SUFFIX=545pm SCHEDULE="45 0 * * *" bash openshift/scripts/oc_provision_sfms_daily_forecasts_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          SCHEDULE="0 6 1 * *" bash openshift/scripts/oc_provision_partitioner_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          END_HOUR=48 STEP=6 MODEL=GDPS bash openshift/scripts/oc_provision_wx_4panel_charts_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"
          END_HOUR=15 STEP=3 MODEL=RDPS bash openshift/scripts/oc_provision_wx_4panel_charts_cronjob.sh ${SUFFIX} >>"${BATCH_FILE}"
          echo "---" >>"${BATCH_FILE}"

          echo "Applying batched manifests in one call..."
          oc -n e1e498-dev apply -f "${BATCH_FILE}"

      - name: Logging alerts
        shell: bash
        run: |
          oc process -f openshift/logging-alerts/oom_alerts.yaml -p NAMESPACE=e1e498-dev -p SEVERITY=warning | oc apply -f -

  deploy-asa-go-dev:
    name: Deploy ASA Go API to Dev
    if: github.triggering_actor != 'renovate'
    needs: [build-image, prepare-dev-database]
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Deploy ASA Go API to Dev
        shell: bash
        run: |
          DEPLOY_VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" REPLICAS="1" HPA_MAX_REPLICAS="2" MEMORY_REQUEST=1Gi MEMORY_LIMIT=1.5Gi ENVIRONMENT="development" bash openshift/scripts/oc_deploy_asa_go_api.sh ${SUFFIX} apply

      - name: Allow APS to reach ASA Go API
        shell: bash
        run: |
          bash openshift/scripts/oc_provision_asa_go_gateway_networkpolicy.sh ${SUFFIX} apply

  deploy-sfms-fwi-dev:
    name: Deploy SFMS FWI API to Dev
    if: github.triggering_actor != 'renovate'
    needs: [build-image, prepare-dev-database]
    runs-on:
      group: Larger Runners - OpenShift Static-IP
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oc-setup

      - uses: ./.github/actions/oc-login
        with:
          oc-server: ${{ secrets.OPENSHIFT_CLUSTER }}
          oc-token: ${{ secrets.OC4_DEV_TOKEN }}
          oc-namespace: e1e498-dev

      - name: Deploy SFMS FWI API to Dev
        shell: bash
        run: |
          DEPLOY_VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" REPLICAS="1" ENVIRONMENT="development" bash openshift/scripts/oc_deploy_sfms_fwi_api.sh ${SUFFIX} apply

      - name: Allow APS to reach SFMS FWI API
        shell: bash
        run: |
          bash openshift/scripts/oc_provision_sfms_fwi_gateway_networkpolicy.sh ${SUFFIX} apply

  publish-aps-gateway-dev:
    name: Publish APS Gateway Config to Dev
    if: github.triggering_actor != 'renovate'
    needs: [deploy-asa-go-dev, deploy-sfms-fwi-dev]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gwa-setup

      - name: Render and publish ASA Go APS gateway config
        uses: ./.github/actions/aps-publish
        with:
          config-name: asa-go
          render-script: openshift/scripts/render_asa_go_gateway_config.sh
          gateway-id: ${{ env.APS_TEST_GATEWAY_ID }}
          client-id: ${{ secrets.GWA_TEST_ACCT_ID }}
          client-secret: ${{ secrets.GWA_TEST_ACCT_SECRET }}
          suffix: ${{ env.SUFFIX }}
          host: api-gov-bc-ca.test.api.gov.bc.ca

      - name: Render and publish SFMS FWI APS gateway config
        uses: ./.github/actions/aps-publish
        with:
          config-name: sfms-fwi
          render-script: openshift/scripts/render_sfms_fwi_gateway_config.sh
          gateway-id: ${{ env.APS_TEST_GATEWAY_ID }}
          client-id: ${{ secrets.GWA_TEST_ACCT_ID }}
          client-secret: ${{ secrets.GWA_TEST_ACCT_SECRET }}
          suffix: ${{ env.SUFFIX }}
          qualifier-prefix: fwi-
          host: api-gov-bc-ca.test.api.gov.bc.ca

      - name: Publish SFMS FWI dataset and product to test API Directory
        uses: ./.github/actions/sfms-fwi-aps-apply
        with:
          gateway-id: ${{ env.APS_TEST_GATEWAY_ID }}
          client-id: ${{ secrets.GWA_TEST_ACCT_ID }}
          client-secret: ${{ secrets.GWA_TEST_ACCT_SECRET }}
          suffix: ${{ env.SUFFIX }}
          host: api-gov-bc-ca.test.api.gov.bc.ca

  scan-dev:
    name: ZAP Baseline Scan Dev
    needs: [deploy-dev]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zap-baseline-scan
        with:
          target: "https://wps-pr-${{ github.event.number }}-e1e498-dev.apps.silver.devops.gov.bc.ca"
          cmd-options: "-I"
