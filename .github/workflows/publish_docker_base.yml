name: Publish Base Docker Images to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Each architecture builds natively on its own runner, then merge combines them into one multi-arch tag
  build:
    name: Build ${{ matrix.image }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        image: [wps-api-base, wps-jobs-base]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and Push ${{ matrix.image }} ${{ matrix.platform.arch }}
        env:
          TAG: ghcr.io/bcgov/wps/${{ matrix.image }}:run-${{ github.run_id }}-${{ matrix.platform.arch }}
        run: |
          docker build openshift/${{ matrix.image }}/docker --tag ${TAG}
          docker push ${TAG}

  merge:
    name: Publish ${{ matrix.image }} Multi-arch Image
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [wps-api-base, wps-jobs-base]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/setup-buildx-action@v4
      - name: Create Multi-arch Manifest
        env:
          IMAGE: ghcr.io/bcgov/wps/${{ matrix.image }}
        run: |
          DATE_TAG=$(date +%m-%d-%Y)
          docker buildx imagetools create \
            --tag ${IMAGE}:${DATE_TAG} \
            --tag ${IMAGE}:latest \
            ${IMAGE}:run-${{ github.run_id }}-amd64 \
            ${IMAGE}:run-${{ github.run_id }}-arm64
