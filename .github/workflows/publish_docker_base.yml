name: Publish Base Docker Images to GHCR

permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Resolved before building so a branch run without an open PR fails before any image is built
  tags:
    name: Resolve Tags
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Resolve Tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only main moves the shared date and latest tags; branch runs (workflow_dispatch) get a
          # PR-scoped tag so nothing else picks up an unmerged base image
          DATE_TAG=$(date +%m-%d-%Y)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tags=${DATE_TAG} latest" >> "${GITHUB_OUTPUT}"
          else
            pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
            [ -n "${pr}" ] || { echo "::error::No open PR for branch ${GITHUB_REF_NAME}; branch runs are tagged by PR number"; exit 1; }
            echo "tags=pr-${pr}-${DATE_TAG}" >> "${GITHUB_OUTPUT}"
          fi

  # Each architecture builds natively on its own runner, then merge combines them into one multi-arch tag
  build:
    name: Build ${{ matrix.image }} ${{ matrix.platform.arch }}
    needs: tags
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [wps-api-base, wps-jobs-base]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and Push ${{ matrix.image }} ${{ matrix.platform.arch }}
        env:
          TAG: ghcr.io/bcgov/wps/${{ matrix.image }}:run-${{ github.run_id }}-${{ matrix.platform.arch }}
        run: |
          docker build openshift/${{ matrix.image }}/docker --tag ${TAG}
          docker push ${TAG}

  merge:
    name: Publish ${{ matrix.image }} Multi-arch Image
    needs: [tags, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        image: [wps-api-base, wps-jobs-base]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create Multi-arch Manifest
        env:
          IMAGE: ghcr.io/bcgov/wps/${{ matrix.image }}
        run: |
          tags=()
          for tag in ${{ needs.tags.outputs.tags }}; do
            tags+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${tags[@]}" \
            ${IMAGE}:run-${{ github.run_id }}-amd64 \
            ${IMAGE}:run-${{ github.run_id }}-arm64
