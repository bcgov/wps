name: Integration

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-api:
    name: Python - Lint
    runs-on: ubuntu-26.04
    # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases
    container: &api-base-image
      image: ghcr.io/bcgov/wps/wps-api-base:10-20-2026
      options: --user 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Lint (api/wps_shared/wps_jobs)
        working-directory: ./backend
        run: uv run ruff check packages/wps-api/src packages/wps-shared/src packages/wps-jobs/src

  test-api:
    name: Python - API Test with coverage
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          install-jdk: "true"
      - name: Unit Test with coverage (api)
        working-directory: ./backend
        run: |
          export LD_LIBRARY_PATH=$(uv run python -m rpy2.situation LD_LIBRARY_PATH):${LD_LIBRARY_PATH}
          export CLASSPATH=./packages/wps-api/libs/REDapp_Lib.jar:./packages/wps-api/libs/WTime.jar:./packages/wps-api/libs/hss-java.jar:$CLASSPATH
          export ORIGINS=testorigin
          export SFMS_SECRET=secret
          uv run pytest -n auto --cov=packages/wps-api/src/app --cov-branch --cov-report=xml:packages/wps-api/coverage-reports/api-coverage-report.xml packages/wps-api/src/app/tests -x -o log_cli=true --disable-warnings -vvv
      - name: Archive coverage report (api)
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: ./backend/packages/wps-api/coverage-reports/api-coverage-report.xml

  test-wps-shared:
    name: Python - WPS Shared Test with coverage
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          install-jdk: "true"
      - name: Unit Test with coverage (wps_shared)
        working-directory: ./backend
        run: |
          export ORIGINS=testorigin
          export SFMS_SECRET=secret
          uv run pytest --cov=packages/wps-shared/src/wps_shared --cov-branch --cov-report=xml:packages/wps-shared/coverage-reports/wps-shared-coverage-report.xml packages/wps-shared/src/wps_shared/tests -x -o log_cli=true --disable-warnings -vvv
      - name: Archive coverage report (wps_shared)
        uses: actions/upload-artifact@v7
        with:
          name: wps-shared-coverage-report
          path: ./backend/packages/wps-shared/coverage-reports/wps-shared-coverage-report.xml

  test-wps-jobs:
    name: Python - WPS Jobs Test with coverage
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install ecCodes library
        run: |
          apt-get update --fix-missing
          apt-get -y install libeccodes-tools
      - uses: ./.github/actions/python-setup
        with:
          install-jdk: "true"
      - name: Unit Test with coverage (wps_jobs)
        working-directory: ./backend
        run: |
          export LD_LIBRARY_PATH=$(uv run python -m rpy2.situation LD_LIBRARY_PATH):${LD_LIBRARY_PATH}
          export ORIGINS=testorigin
          export SFMS_SECRET=secret
          uv run pytest --cov=packages/wps-jobs/src --cov-branch --cov-report=xml:packages/wps-jobs/coverage-reports/wps-jobs-coverage-report.xml packages/wps-jobs/src/tests -x -o log_cli=true --disable-warnings -vvv
      - name: Archive coverage report (wps_jobs)
        uses: actions/upload-artifact@v7
        with:
          name: wps-jobs-coverage-report
          path: ./backend/packages/wps-jobs/coverage-reports/wps-jobs-coverage-report.xml

  test-wps-weather:
    name: Python - WPS Weather Test
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
      - name: Unit Test (wps_weather)
        working-directory: ./backend
        run: |
          uv run pytest packages/wps-weather/src/wps_weather/tests -x -o log_cli=true --disable-warnings -vvv

  test-wps-sfms:
    name: Python - WPS SFMS Test
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
      - name: Unit Test (wps_sfms)
        working-directory: ./backend
        run: |
          uv run pytest packages/wps-sfms/src/wps_sfms/tests -x -o log_cli=true --disable-warnings -vvv

  test-wps-wf1:
    name: Python - WF1 Test with coverage
    runs-on: ubuntu-26.04
    container: *api-base-image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          install-jdk: "true"
      - name: Unit Test with coverage (wps_wf1)
        working-directory: ./backend
        run: |
          uv run pytest --cov=packages/wps-wf1/src/wps_wf1 --cov-branch --cov-report=xml:packages/wps-wf1/coverage-reports/wps-wf1-coverage-report.xml packages/wps-wf1/src/wps_wf1/tests -x -o log_cli=true --disable-warnings -vvv
      - name: Archive coverage report (wps_wf1)
        uses: actions/upload-artifact@v7
        with:
          name: wps-wf1-coverage-report
          path: ./backend/packages/wps-wf1/coverage-reports/wps-wf1-coverage-report.xml

  lint-and-test-web:
    name: Web - Lint, Test with coverage
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: |
            **/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: enable corepack
        run: corepack enable
      - name: use new yarn
        run: yarn set version berry
      - name: Install node dependencies (web)
        working-directory: ./web
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install
      - name: Lint (web)
        working-directory: ./web
        run: yarn run lint
      - name: Playwright tests (web)
        working-directory: ./web
        run: yarn run playwright:ci
      - name: Unit tests (web)
        working-directory: ./web
        run: yarn run coverage:ci
      - name: Merge and finalize test coverage (web)
        working-directory: ./web
        run: yarn run finalizeCoverage
      - name: Archive coverage report (web)
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-report
          path: ./web/apps/wps-web/finalCoverage

  upload-code-coverage:
    name: Coverage with CodeCov
    runs-on: ubuntu-26.04
    needs:
      [
        lint-and-test-web,
        test-api,
        test-wps-shared,
        test-wps-jobs,
        test-wps-wf1,
      ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8
      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  lint-and-test-prune:
    name: Backup Prune - Lint and Test
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: openshift/s3-backup/docker/uv.lock
      - name: Install python dependencies using uv (s3-backup)
        working-directory: ./openshift/s3-backup/docker
        run: uv sync --locked
      - name: Lint (s3-backup)
        working-directory: ./openshift/s3-backup/docker
        run: uv run ruff check *.py
      - name: Unit tests (s3-backup)
        working-directory: ./openshift/s3-backup/docker
        run: uv run pytest -v
